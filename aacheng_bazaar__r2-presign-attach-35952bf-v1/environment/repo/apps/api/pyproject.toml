[project]
name = "bazaar-api"
version = "0.1.0"
description = "Bazaar — headless embeddable marketplace API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pydantic-settings>=2.6",
    # Required at import time by generated/models.py (spec `format: email`
    # fields codegen to EmailStr). Runtime dep, not dev: handlers return
    # generated models in production.
    "email-validator>=2.0",
    "redis>=5.0",
    "alembic>=1.14",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "datamodel-code-generator>=0.72.1",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bazaar_api"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Generated from spec/openapi.yaml by datamodel-codegen (pnpm gen). Never
# hand-edit; the generator's line wrapping is authoritative. Lint/format the
# hand-written tree only — CI enforces correctness: `gen:check` fails if this
# file is stale, and the drift guard (T283279799) fails if routes leave spec.
extend-exclude = ["src/bazaar_api/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
